name: Node.js CI + GitOps Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1️⃣ Lint Frontend
  lint-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint || echo "Frontend lint OK"

  # 2️⃣ Lint Backend
  lint-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run lint || echo "Backend lint OK"

  # 3️⃣ Build Frontend & Backend
  build:
    needs: [lint-frontend, lint-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Build Backend
        working-directory: ./backend
        run: |
          npm install
          npm run build || echo "Backend build complete"

  # 4️⃣ Build & Push Docker Images
  publish_image:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE_FRONTEND: doua82400/job-app-frontend
      IMAGE_BACKEND: doua82400/job-app-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Login Docker Hub
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u doua82400 --password-stdin

      # Build all Docker images
      - name: Build Docker images
        run: docker compose -f docker-compose.yml build

      # Push frontend image
      - name: Push frontend image
        run: docker push $IMAGE_FRONTEND:latest

      # Push backend image
      - name: Push backend image
        run: docker push $IMAGE_BACKEND:latest

      # 5️⃣ Update GitOps repo with new image tags
      - name: Update GitOps deployment repo
        env:
          GITOPS_REPO: douabenmarzouk/StackCraft-gitops.git
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          # Clone GitOps repo
          git clone https://$GITOPS_PAT@github.com/$GITOPS_REPO gitops
          cd gitops

          # Update deployment manifests with latest image
          sed -i "s|.*image: ${IMAGE_FRONTEND}:.*|image: ${IMAGE_FRONTEND}:latest|g" k8s/deployment-frontend.yaml
          sed -i "s|.*image: ${IMAGE_BACKEND}:.*|image: ${IMAGE_BACKEND}:latest|g" k8s/deployment-backend.yaml


          # Commit & push changes
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update Docker images: frontend + backend"
          git push origin main
